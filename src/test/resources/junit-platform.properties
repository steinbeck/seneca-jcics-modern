# Parallel execution is enabled, but everything runs on one thread unless a test factory opts in with
# @Execution(CONCURRENT): the dynamic tests of the long golden run/trajectory factories (no shared
# state, design.md 8). Test classes run one after another (some oracle tests touch legacy static
# state), and the pool is capped at one thread per core.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
junit.jupiter.execution.parallel.config.dynamic.max-pool-size-factor=1
junit.jupiter.execution.parallel.config.dynamic.saturate=true
